name: CI mesa de ayuda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas de la CLI
        run: python -m unittest discover -s tests -v
      - name: Generar lista de archivos versionados
        run: git ls-files > inventario.txt
      - name: Guardar inventario
        uses: actions/upload-artifact@v4
        with:
          name: inventario-repositorio
          path: inventario.txt
          retention-days: 7
